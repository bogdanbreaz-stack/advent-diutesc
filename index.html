<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advent Diutesc</title>
<meta name="description" content="Un calendar de advent doar pentru tine 🎄">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0d1b2a;
  --pine:#0f3b2e;
  --pine-2:#165440;
  --gold:#f2c66d;
  --gold-2:#ffe3a3;
  --red:#c8323c;
  --berry:#8e1f2f;
  --cream:#fbf3e4;
  --ink:#3a2418;
  --snow:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:"Fraunces",Georgia,serif;
  color:var(--cream);
  background:
    radial-gradient(1200px 600px at 50% -10%, #23466a 0%, transparent 60%),
    radial-gradient(800px 500px at 100% 100%, #13402f 0%, transparent 60%),
    radial-gradient(700px 500px at 0% 80%, #3a1424 0%, transparent 55%),
    linear-gradient(180deg, #0a1626 0%, var(--night) 45%, #0b2320 100%);
  background-attachment:fixed;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
#snow,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#snow{z-index:0}
#fx{z-index:60}

/* ---------- garland ---------- */
.garland{position:relative;height:70px;z-index:2;pointer-events:none}
.garland svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bulb{
  position:absolute;width:14px;height:20px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  transform:translate(-50%,0);
  background:var(--c);
  box-shadow:0 0 12px 3px var(--c), 0 0 28px 6px color-mix(in srgb, var(--c) 50%, transparent);
  animation:twinkle 2.4s ease-in-out infinite;
  animation-delay:var(--d);
}
.bulb::before{content:"";position:absolute;top:-6px;left:3px;width:8px;height:7px;background:#3b3b3b;border-radius:2px}
@keyframes twinkle{0%,100%{opacity:1;filter:brightness(1.15)}50%{opacity:.35;filter:brightness(.6)}}

/* ---------- layout ---------- */
main{position:relative;z-index:3;max-width:980px;margin:0 auto;padding:0 16px 120px}
header{text-align:center;padding:18px 0 8px}
.eyebrow{
  font-style:italic;letter-spacing:.32em;text-transform:uppercase;font-size:.78rem;color:var(--gold);
  opacity:0;animation:rise .9s .2s forwards;
}
h1{
  font-family:"Mountains of Christmas",cursive;font-weight:700;
  font-size:clamp(3.4rem, 13vw, 8.5rem);line-height:.95;margin:.15em 0 .1em;
  color:var(--gold-2);
  text-shadow:0 2px 0 #b5822f, 0 4px 0 #8a5a1c, 0 0 40px rgba(255,210,120,.45), 0 12px 30px rgba(0,0,0,.5);
  cursor:pointer;user-select:none;
}
h1 span{display:inline-block;opacity:0;transform:translateY(30px) rotate(-6deg);animation:letter .8s cubic-bezier(.2,1.5,.4,1) forwards}
h1 span.sp{width:.25em}
h1 span:hover{animation:bob .6s ease}
@keyframes letter{to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:none}40%{transform:translateY(-14px) rotate(-6deg)}70%{transform:translateY(3px) rotate(3deg)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sub{
  font-style:italic;font-size:clamp(1rem,2.6vw,1.2rem);color:#e9dcc4;max-width:34ch;margin:0 auto;
  opacity:0;animation:rise .9s 1.1s forwards;
}

/* ---------- countdown ---------- */
.count{
  margin:28px auto 10px;max-width:560px;text-align:center;
  background:linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
  border:1px solid rgba(242,198,109,.35);border-radius:22px;padding:18px 16px 20px;
  box-shadow:0 20px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(6px);
  opacity:0;animation:rise .9s 1.3s forwards;
  position:relative;
}
.count::before,.count::after{content:"❄";position:absolute;top:10px;color:var(--gold);opacity:.6;font-size:1rem}
.count::before{left:16px}.count::after{right:16px}
.count-label{font-style:italic;color:var(--gold-2);font-size:1rem;margin-bottom:12px}
.digits{display:flex;justify-content:center;gap:clamp(6px,2vw,14px)}
.unit{min-width:clamp(58px,16vw,86px)}
.unit b{
  display:block;font-family:"Fraunces",serif;font-weight:600;font-size:clamp(1.7rem,6vw,2.6rem);
  background:linear-gradient(180deg,#1d4a3b,#0f3024);border-radius:14px;padding:8px 0;
  border:1px solid rgba(242,198,109,.4);color:var(--cream);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.3);
  font-variant-numeric:tabular-nums;
}
.unit b.tick{animation:tick .35s ease}
@keyframes tick{0%{transform:scale(1)}40%{transform:scale(1.08);color:var(--gold-2)}100%{transform:scale(1)}}
.unit small{display:block;margin-top:6px;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#cdbf9f}
.done-msg{font-family:"Mountains of Christmas",cursive;font-size:2rem;color:var(--gold-2)}

/* ---------- progress ---------- */
.progress{max-width:560px;margin:18px auto 30px;text-align:center;opacity:0;animation:rise .9s 1.5s forwards}
.progress p{font-size:.95rem;color:#e7d9bf;margin-bottom:8px}
.progress p em{color:var(--gold-2);font-style:normal;font-weight:600}
.bar{height:14px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:repeating-linear-gradient(-45deg,#fff 0 10px,var(--red) 10px 20px);
  background-size:28px 28px;animation:candy 1.2s linear infinite;
  transition:width 1s cubic-bezier(.2,1,.3,1);
}
@keyframes candy{to{background-position:28px 0}}

/* ---------- grid ---------- */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
  gap:clamp(14px,3vw,26px) clamp(10px,2.5vw,22px);
  grid-auto-flow:dense;
}
@media (max-width:420px){.grid{grid-template-columns:repeat(3,1fr)}}

.gift{
  --box:var(--red);--rib:var(--gold);
  position:relative;aspect-ratio:1/1.08;border:0;background:none;cursor:pointer;
  font-size:clamp(11px,2.6vw,15px);
  opacity:0;transform:translateY(24px) scale(.9);
  animation:giftIn .7s cubic-bezier(.2,1.4,.4,1) forwards;
  animation-delay:calc(1.4s + var(--i) * 45ms);
  outline:none;
}
.gift:focus-visible .box{outline:3px solid var(--gold-2);outline-offset:4px}
@keyframes giftIn{to{opacity:1;transform:none}}
.gift.big{grid-column:span 2;grid-row:span 2;font-size:clamp(18px,4.6vw,26px)}
@media (max-width:420px){.gift.big{grid-column:span 3;grid-row:span 2;aspect-ratio:1.5/1}}
.gift.mid{grid-column:span 2;aspect-ratio:2/1.08;font-size:clamp(14px,3.4vw,19px)}
.gift.mid .box{left:14%;right:14%;box-shadow:inset 0 -.6em 0 rgba(0,0,0,.18), inset 0 .25em 0 rgba(255,255,255,.12), 0 0 1.6em rgba(242,198,109,.45), 0 .8em 1.4em rgba(0,0,0,.45)}
.gift.mid .lid{left:10%;right:10%}
.gift.mid .tag{font-size:1.85em}
.star13{
  position:absolute;z-index:5;font-size:1.4em;pointer-events:none;
  filter:drop-shadow(0 0 .4em rgba(255,214,120,.9));animation:twinkle13 2.2s ease-in-out infinite;
}
.star13.a{left:6%;top:18%}.star13.b{right:6%;top:30%;animation-delay:.8s;font-size:1em}.star13.c{left:12%;bottom:8%;animation-delay:1.4s;font-size:.9em}
@keyframes twinkle13{50%{transform:scale(.6) rotate(20deg);opacity:.5}}
.gift.mid.locked .star13{opacity:.5}

.gift .inner{position:absolute;inset:0;transition:transform .25s}
.gift:not(.locked):hover .inner{transform:translateY(-4px) rotate(-2deg)}
.gift.locked:hover .inner{transform:translateY(-2px)}

.box{
  position:absolute;left:9%;right:9%;bottom:4%;height:62%;border-radius:.45em;
  background:
    linear-gradient(90deg,transparent 43%,var(--rib) 43% 57%,transparent 57%),
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.18), transparent 50%),
    var(--box);
  box-shadow:inset 0 -.6em 0 rgba(0,0,0,.18), inset 0 .25em 0 rgba(255,255,255,.12), 0 .8em 1.4em rgba(0,0,0,.45);
}
.box.pattern{
  background:
    linear-gradient(90deg,transparent 43%,var(--rib) 43% 57%,transparent 57%),
    radial-gradient(circle, rgba(255,255,255,.35) 0 .14em, transparent .16em) 0 0/1.1em 1.1em,
    var(--box);
}
.box.stripes{
  background:
    linear-gradient(90deg,transparent 43%,var(--rib) 43% 57%,transparent 57%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 .4em, transparent .4em .8em),
    var(--box);
}
.lid{
  position:absolute;left:4%;right:4%;bottom:62%;height:17%;border-radius:.4em;z-index:2;
  background:
    linear-gradient(90deg,transparent 42%,var(--rib) 42% 58%,transparent 58%),
    var(--box);
  filter:brightness(1.12);
  box-shadow:0 .25em .4em rgba(0,0,0,.35), inset 0 -.2em 0 rgba(0,0,0,.15);
  transform-origin:80% 100%;
  transition:transform .8s cubic-bezier(.25,1.6,.45,1), opacity .5s;
}
.bow{position:absolute;left:50%;bottom:88%;width:0;height:0}
.bow::before,.bow::after{
  content:"";position:absolute;bottom:0;width:1.9em;height:1.35em;
  border:.38em solid var(--rib);border-radius:50%;
  filter:drop-shadow(0 .1em .1em rgba(0,0,0,.3));
}
.bow::before{right:-.15em;transform:rotate(-24deg);transform-origin:right bottom}
.bow::after{left:-.15em;transform:rotate(24deg);transform-origin:left bottom}
.knot{position:absolute;left:50%;bottom:78%;width:.75em;height:.75em;margin-left:-.375em;border-radius:50%;background:var(--rib);z-index:3;box-shadow:inset 0 -.1em 0 rgba(0,0,0,.25)}

.tag{
  position:absolute;left:50%;top:58%;transform:translate(-50%,-50%) rotate(-4deg);z-index:4;
  min-width:2.3em;padding:.12em .45em .18em;border-radius:.4em;
  background:var(--cream);color:var(--ink);
  font-family:"Mountains of Christmas",cursive;font-weight:700;font-size:1.65em;line-height:1;text-align:center;
  box-shadow:0 .15em .35em rgba(0,0,0,.35);
}
.tag::before{content:"";position:absolute;left:-.22em;top:50%;width:.3em;height:.3em;margin-top:-.15em;border-radius:50%;background:var(--box);box-shadow:0 0 0 .08em var(--ink) inset}

.lock{
  position:absolute;right:4%;top:14%;z-index:5;width:1.9em;height:1.9em;border-radius:50%;
  display:grid;place-items:center;font-size:.95em;
  background:rgba(13,27,42,.85);border:1px solid rgba(242,198,109,.5);
}
.gift.locked .box,.gift.locked .lid{filter:saturate(.45) brightness(.62)}
.gift.locked .tag{opacity:.75}
.gift:not(.locked) .lock{display:none}

.today-badge{
  display:none;position:absolute;left:50%;top:-6%;transform:translateX(-50%);z-index:6;
  font-size:.8em;letter-spacing:.14em;text-transform:uppercase;font-weight:600;white-space:nowrap;
  background:var(--gold);color:var(--ink);padding:.2em .7em;border-radius:99px;
  box-shadow:0 0 18px rgba(242,198,109,.8);
  animation:pulse 1.6s ease-in-out infinite;
}
.gift.today:not(.opened) .today-badge{display:block}
.gift.today:not(.opened) .box{animation:glow 1.8s ease-in-out infinite}
.gift.today:not(.opened) .inner{animation:wiggle 3s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.08)}}
@keyframes glow{50%{box-shadow:inset 0 -.6em 0 rgba(0,0,0,.18), 0 0 2.2em .4em rgba(255,214,120,.65), 0 .8em 1.4em rgba(0,0,0,.45)}}
@keyframes wiggle{0%,80%,100%{transform:none}84%{transform:rotate(-5deg)}88%{transform:rotate(5deg)}92%{transform:rotate(-3deg)}96%{transform:rotate(2deg)}}

/* opened */
.gift.opened .lid{transform:translate(38%,-70%) rotate(32deg)}
.gift.opened .box::after{
  content:"";position:absolute;left:10%;right:10%;top:-.2em;height:1.4em;border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(255,232,170,.95), rgba(255,200,90,.3) 50%, transparent 70%);
  filter:blur(2px);animation:shimmer 2.6s ease-in-out infinite;
}
.gift.opened .heart{opacity:1;transform:translate(-50%,0) scale(1)}
.heart{
  position:absolute;left:50%;bottom:66%;z-index:1;font-size:1.6em;opacity:0;
  transform:translate(-50%,40%) scale(.3);transition:all .7s .3s cubic-bezier(.2,1.6,.4,1);
  animation:float 3s ease-in-out infinite;
}
@keyframes shimmer{50%{opacity:.55}}
@keyframes float{50%{margin-bottom:.3em}}

.gift.shake .inner{animation:shake .6s cubic-bezier(.36,.07,.19,.97)}
.gift.no .inner{animation:no .5s ease}
@keyframes shake{
  0%,100%{transform:none}
  15%{transform:rotate(-8deg) scale(1.04)}30%{transform:rotate(8deg) scale(1.06)}
  45%{transform:rotate(-6deg) scale(1.08)}60%{transform:rotate(6deg) scale(1.1)}
  75%{transform:rotate(-3deg) scale(1.12)}
}
@keyframes no{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- modal ---------- */
.modal{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;
  background:rgba(6,12,20,.68);backdrop-filter:blur(5px);
  opacity:0;pointer-events:none;transition:opacity .35s;
}
.modal.show{opacity:1;pointer-events:auto}
.letter{
  position:relative;width:min(520px,100%);max-height:88vh;overflow:auto;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,255,255,.7), transparent 40%),
    linear-gradient(180deg,#fdf7ea,#f5e7cc);
  color:var(--ink);border-radius:18px;padding:44px 30px 30px;text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 6px rgba(200,50,60,.9), 0 0 0 9px var(--gold), 0 0 0 10px rgba(0,0,0,.2);
  transform:translateY(40px) scale(.85) rotate(-2deg);transition:transform .6s cubic-bezier(.2,1.5,.4,1);
}
.modal.show .letter{transform:none}
.letter .seal{
  position:absolute;top:-28px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #e0505b, var(--berry));display:grid;place-items:center;
  font-size:1.5rem;box-shadow:0 6px 14px rgba(0,0,0,.35), inset 0 -3px 0 rgba(0,0,0,.25);
}
.letter .holly{position:absolute;font-size:1.6rem;opacity:.9}
.letter .h1{top:10px;left:12px;transform:rotate(-20deg)}
.letter .h2{bottom:10px;right:12px;transform:rotate(160deg)}
.letter .day{font-family:"Mountains of Christmas",cursive;font-weight:700;font-size:2.4rem;color:var(--red);line-height:1}
.letter .date{font-style:italic;font-size:.9rem;color:#8a6a4a;margin:4px 0 18px;letter-spacing:.06em}
.letter blockquote{
  font-size:clamp(1.15rem,3.6vw,1.38rem);line-height:1.55;font-style:italic;min-height:4.5em;
  white-space:pre-line;
}
.letter blockquote .caret{display:inline-block;width:2px;height:1.1em;background:var(--red);vertical-align:-.15em;margin-left:2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.letter .sign{margin-top:20px;font-family:"Mountains of Christmas",cursive;font-size:1.5rem;color:var(--pine-2);opacity:0;transition:opacity .8s}
.letter .sign.show{opacity:1}
.letter .close{
  margin-top:22px;border:0;cursor:pointer;font:inherit;font-weight:600;
  background:var(--pine-2);color:var(--cream);padding:.7em 1.6em;border-radius:99px;
  box-shadow:0 6px 0 #0b2e23, 0 10px 18px rgba(0,0,0,.25);transition:transform .15s, box-shadow .15s;
}
.letter .close:active{transform:translateY(4px);box-shadow:0 2px 0 #0b2e23}
.letter .x{position:absolute;top:10px;right:14px;border:0;background:none;font-size:1.6rem;color:#a07a55;cursor:pointer;line-height:1}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:28px;z-index:70;transform:translate(-50%,30px);opacity:0;
  background:var(--cream);color:var(--ink);padding:12px 20px;border-radius:99px;max-width:calc(100% - 32px);
  font-style:italic;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.4);
  transition:all .4s cubic-bezier(.2,1.4,.4,1);pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- footer hills ---------- */
.hills{position:fixed;left:0;right:0;bottom:0;height:90px;z-index:1;pointer-events:none}
footer{position:relative;z-index:3;text-align:center;padding:30px 16px 60px;font-style:italic;color:#cdbf9f;font-size:.95rem}
footer span{color:var(--red)}

.spark{position:fixed;z-index:80;pointer-events:none;font-size:16px;will-change:transform,opacity}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="snow"></canvas>

<div class="garland" id="garland"><svg id="wire"></svg></div>

<main>
  <header>
    <p class="eyebrow">doar pentru tine · decembrie 2026</p>
    <h1 id="title" aria-label="Advent Diutesc"></h1>
    <p class="sub">În fiecare zi până la Crăciun se deschide un cadou mic, cu un gând mare pentru tine.</p>
  </header>

  <section class="count" aria-live="polite">
    <p class="count-label" id="countLabel">…</p>
    <div class="digits" id="digits">
      <div class="unit"><b id="dd">00</b><small>zile</small></div>
      <div class="unit"><b id="hh">00</b><small>ore</small></div>
      <div class="unit"><b id="mm">00</b><small>minute</small></div>
      <div class="unit"><b id="ss">00</b><small>secunde</small></div>
    </div>
  </section>

  <section class="progress">
    <p id="progressText"></p>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <section class="grid" id="grid" aria-label="Calendarul de advent"></section>
</main>

<footer>făcut cu <span>♥</span> pentru Diuța</footer>

<svg class="hills" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 60 Q 180 20 360 55 T 720 50 T 1080 45 T 1440 55 V90 H0Z" fill="#dfe9f2" opacity=".18"/>
  <path d="M0 75 Q 240 45 480 72 T 960 68 T 1440 70 V90 H0Z" fill="#eef4fa" opacity=".28"/>
</svg>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mDay">
  <div class="letter" id="letter">
    <div class="seal">💌</div>
    <span class="holly h1">🌿</span><span class="holly h2">🌿</span>
    <button class="x" id="mX" aria-label="Închide">×</button>
    <div class="day" id="mDay">Ziua 1</div>
    <div class="date" id="mDate">1 decembrie</div>
    <blockquote id="mQuote"></blockquote>
    <div class="sign" id="mSign">cu toată dragostea ♥</div>
    <button class="close" id="mClose">Păstrez în inimă ✨</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>

<script>
/* =====================================================================
   CITATELE — câte unul pentru fiecare zi (1 → 25 decembrie)
   ===================================================================== */
const QUOTES = [
  /* 1  */ "Citatul pentru ziua 1 — vine curând ✨",
  /* 2  */ "Citatul pentru ziua 2 — vine curând ✨",
  /* 3  */ "Citatul pentru ziua 3 — vine curând ✨",
  /* 4  */ "Citatul pentru ziua 4 — vine curând ✨",
  /* 5  */ "Citatul pentru ziua 5 — vine curând ✨",
  /* 6  */ "Citatul pentru ziua 6 — vine curând ✨",
  /* 7  */ "Citatul pentru ziua 7 — vine curând ✨",
  /* 8  */ "Citatul pentru ziua 8 — vine curând ✨",
  /* 9  */ "Citatul pentru ziua 9 — vine curând ✨",
  /* 10 */ "Citatul pentru ziua 10 — vine curând ✨",
  /* 11 */ "Citatul pentru ziua 11 — vine curând ✨",
  /* 12 */ "Citatul pentru ziua 12 — vine curând ✨",
  /* 13 */ "Citatul pentru ziua 13 — vine curând ✨",
  /* 14 */ "Citatul pentru ziua 14 — vine curând ✨",
  /* 15 */ "Citatul pentru ziua 15 — vine curând ✨",
  /* 16 */ "Citatul pentru ziua 16 — vine curând ✨",
  /* 17 */ "Citatul pentru ziua 17 — vine curând ✨",
  /* 18 */ "Citatul pentru ziua 18 — vine curând ✨",
  /* 19 */ "Citatul pentru ziua 19 — vine curând ✨",
  /* 20 */ "Citatul pentru ziua 20 — vine curând ✨",
  /* 21 */ "Citatul pentru ziua 21 — vine curând ✨",
  /* 22 */ "Citatul pentru ziua 22 — vine curând ✨",
  /* 23 */ "Citatul pentru ziua 23 — vine curând ✨",
  /* 24 */ "Citatul pentru ziua 24 — vine curând ✨",
  /* 25 */ "Citatul pentru ziua 25 — vine curând ✨",
];
const YEAR = 2026;
const DAYS = 25;

/* ---------- timp (cu mod de previzualizare: ?preview=2026-12-05T23:59:50) ---------- */
const params = new URLSearchParams(location.search);
let offset = 0;
if (params.get("preview")) {
  const p = new Date(params.get("preview"));
  if (!isNaN(p)) offset = p - Date.now();
}
const now = () => new Date(Date.now() + offset);
const unlockAt = d => new Date(YEAR, 11, d, 0, 0, 0);
const isUnlocked = d => now() >= unlockAt(d);

/* ---------- memorie (rămâne salvată în browser) ---------- */
const KEY = "adventDiutesc_2026";
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.opened) return s; } catch(e){}
  return { opened:{}, visits:0 };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
if (params.has("reset")) { try { localStorage.removeItem(KEY); } catch(e){} }
const state = load();
state.visits = (state.visits||0) + 1; state.lastVisit = Date.now(); save();

/* ---------- titlu animat ---------- */
const title = document.getElementById("title");
"Advent Diutesc".split("").forEach((ch,i)=>{
  const s = document.createElement("span");
  if (ch === " ") s.className = "sp"; else s.textContent = ch;
  s.style.animationDelay = (0.3 + i*0.06) + "s";
  s.addEventListener("animationend", ()=>{ s.style.opacity=1; s.style.transform="none"; s.style.animation="none"; void s.offsetWidth; s.style.animation=""; s.style.animationName="none"; }, {once:true});
  s.addEventListener("mouseenter", ()=>{ s.style.animation="none"; void s.offsetWidth; s.style.animation="bob .6s ease"; });
  title.appendChild(s);
});
title.addEventListener("click", e => { burst(e.clientX, e.clientY, 40, ["❄","✦","♥","★"]); });

/* ---------- ghirlanda ---------- */
const COLORS = ["#ff4d5e","#ffd166","#5ee3a1","#6cc6ff","#ff8fd1"];
function drawGarland(){
  const g = document.getElementById("garland"), svg = document.getElementById("wire");
  g.querySelectorAll(".bulb").forEach(b=>b.remove());
  const w = g.clientWidth, seg = w < 600 ? 90 : 130, n = Math.ceil(w/seg);
  let d = "M0 6";
  for (let i=0;i<n;i++){ const x=i*seg; d += ` Q ${x+seg/2} 46 ${x+seg} 6`; }
  svg.setAttribute("viewBox",`0 0 ${w} 70`);
  svg.innerHTML = `<path d="${d}" fill="none" stroke="#1f3a2c" stroke-width="3"/>`;
  const per = 4; let k = 0;
  for (let i=0;i<n;i++){
    for (let j=1;j<=per;j++){
      const t = j/(per+1), x0=i*seg, x = x0 + t*seg;
      const y = (1-t)*(1-t)*6 + 2*(1-t)*t*46 + t*t*6;
      const b = document.createElement("span"); b.className="bulb";
      b.style.left = x+"px"; b.style.top = (y+3)+"px";
      b.style.setProperty("--c", COLORS[k%COLORS.length]);
      b.style.setProperty("--d", (Math.random()*2.4).toFixed(2)+"s");
      g.appendChild(b); k++;
    }
  }
}
drawGarland(); addEventListener("resize", drawGarland);

/* ---------- cadouri ---------- */
const PALETTE = [
  ["#c8323c","#f2c66d"],["#165440","#f7e3b5"],["#f2c66d","#c8323c"],["#fbf3e4","#c8323c"],
  ["#8e1f2f","#f2c66d"],["#2d6a8f","#fbf3e4"],["#1d6b4f","#ff6b6b"],["#e2a2b5","#8e1f2f"],
];
const PATTERNS = ["","pattern","stripes"];
const grid = document.getElementById("grid");
const gifts = [];
for (let d=1; d<=DAYS; d++){
  const [box, rib] = PALETTE[(d*5) % PALETTE.length];
  const b = document.createElement("button");
  b.className = "gift" + (d===DAYS ? " big" : d===13 ? " mid" : "");
  b.style.setProperty("--box", box); b.style.setProperty("--rib", rib); b.style.setProperty("--i", d);
  b.setAttribute("aria-label", `Cadoul zilei ${d}`);
  b.innerHTML = `
    <span class="inner">
      <span class="today-badge">azi</span>
      <span class="heart">${d===DAYS ? "🎄" : ["💛","❤️","💚","✨","⭐"][d%5]}</span>
      <span class="box ${PATTERNS[d%3]}"></span>
      <span class="lid"><span class="bow"></span></span>
      <span class="knot"></span>
      <span class="tag">${d}</span>
      <span class="lock">🔒</span>
      ${d===13 ? '<span class="star13 a">✨</span><span class="star13 b">⭐</span><span class="star13 c">✨</span>' : ''}
    </span>`;
  b.addEventListener("click", e => onGift(d, b, e));
  grid.appendChild(b); gifts.push(b);
}

function refreshGifts(){
  const n = now();
  gifts.forEach((b,i)=>{
    const d = i+1, un = isUnlocked(d);
    b.classList.toggle("locked", !un);
    b.classList.toggle("opened", !!state.opened[d]);
    b.classList.toggle("today", un && n.getMonth()===11 && n.getDate()===d && n.getFullYear()===YEAR);
  });
  const c = Object.keys(state.opened).length;
  document.getElementById("progressText").innerHTML =
    c===0 ? "Niciun cadou deschis încă… dar vin toate, unul câte unul 🎁"
    : c===DAYS ? "Le-ai deschis pe <em>toate 25</em>! Crăciun fericit, iubire 🎄"
    : `Ai deschis <em>${c}</em> din <em>${DAYS}</em> cadouri`;
  document.getElementById("barFill").style.width = (c/DAYS*100)+"%";
}

const MONTHS_LEFT = d => `${d} decembrie`;
function onGift(d, el, e){
  const r = el.getBoundingClientRect(), cx = r.left+r.width/2, cy = r.top+r.height*.45;
  if (!isUnlocked(d)){
    el.classList.remove("no"); void el.offsetWidth; el.classList.add("no");
    const lines = [
      `Shh… cadoul ăsta se deschide pe ${MONTHS_LEFT(d)} 🤫`,
      `Încă puțină răbdare, frumoaso — ${MONTHS_LEFT(d)} ✨`,
      `Nu trișăm 😌 Ne vedem pe ${MONTHS_LEFT(d)}`,
      `E încuiat cu dragoste până pe ${MONTHS_LEFT(d)} 🔒💛`,
    ];
    toast(lines[Math.floor(Math.random()*lines.length)]);
    burst(cx, cy, 10, ["❄","❅"]);
    return;
  }
  if (state.opened[d]){ openLetter(d, false); burst(cx, cy, 14, ["♥","✦"]); return; }
  el.classList.add("shake");
  setTimeout(()=>{
    el.classList.remove("shake");
    state.opened[d] = Date.now(); save(); refreshGifts();
    confetti(cx, cy, d===DAYS ? 260 : 120);
    if (d===DAYS) setTimeout(()=>confetti(innerWidth/2, innerHeight/3, 260), 400);
    setTimeout(()=>openLetter(d, true), 650);
  }, 600);
}

/* ---------- scrisoarea ---------- */
const modal = document.getElementById("modal"), mQuote = document.getElementById("mQuote"), mSign = document.getElementById("mSign");
let typer = null, fullText = "";
function openLetter(d, type){
  document.getElementById("mDay").textContent = d===DAYS ? "Crăciun fericit!" : `Ziua ${d}`;
  const dt = unlockAt(d).toLocaleDateString("ro-RO",{weekday:"long", day:"numeric", month:"long"});
  document.getElementById("mDate").textContent = dt;
  fullText = QUOTES[d-1] || "";
  mSign.classList.remove("show");
  modal.classList.add("show");
  clearInterval(typer);
  if (!type){ mQuote.textContent = fullText; mSign.classList.add("show"); return; }
  let i = 0; mQuote.innerHTML = '<span class="caret"></span>';
  typer = setInterval(()=>{
    i++; mQuote.textContent = fullText.slice(0,i);
    const c = document.createElement("span"); c.className="caret"; mQuote.appendChild(c);
    if (i >= fullText.length) finishType();
  }, 32);
  setTimeout(()=>document.getElementById("mClose").focus({preventScroll:true}), 50);
}
function finishType(){ clearInterval(typer); typer=null; mQuote.textContent = fullText; mSign.classList.add("show"); }
function closeLetter(){
  if (typer) { finishType(); return; }
  modal.classList.remove("show");
}
document.getElementById("letter").addEventListener("click", e=>{ if (typer && e.target.tagName!=="BUTTON") finishType(); });
document.getElementById("mClose").addEventListener("click", e=>{ e.stopPropagation(); finishType(); modal.classList.remove("show"); burst(e.clientX,e.clientY,16,["♥","💛","✨"]); });
document.getElementById("mX").addEventListener("click", e=>{ e.stopPropagation(); finishType(); modal.classList.remove("show"); });
modal.addEventListener("click", e=>{ if (e.target===modal){ finishType(); modal.classList.remove("show"); } });
addEventListener("keydown", e=>{ if (e.key==="Escape" && modal.classList.contains("show")){ finishType(); modal.classList.remove("show"); } });

/* ---------- toast ---------- */
const toastEl = document.getElementById("toast"); let toastT;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>toastEl.classList.remove("show"), 2600); }

/* ---------- timer ---------- */
const pad = n => String(n).padStart(2,"0");
const els = {dd:document.getElementById("dd"),hh:document.getElementById("hh"),mm:document.getElementById("mm"),ss:document.getElementById("ss")};
let lastNext = null;
function tick(){
  const n = now();
  let next = null;
  for (let d=1; d<=DAYS; d++){ if (unlockAt(d) > n){ next = d; break; } }
  if (next !== lastNext){
    if (lastNext !== null){ refreshGifts(); if (next===null || next>1) { toast("Un cadou nou tocmai s-a deschis! 🎁"); confetti(innerWidth/2, innerHeight/2, 120); } }
    lastNext = next;
  }
  const label = document.getElementById("countLabel"), digits = document.getElementById("digits");
  if (next === null){
    label.innerHTML = '<span class="done-msg">Crăciun fericit, iubirea mea! 🎄</span>';
    digits.style.display = "none";
    return;
  }
  digits.style.display = "";
  const todayIdx = next-1;
  const todayWaiting = todayIdx>=1 && !state.opened[todayIdx];
  label.textContent = next===1
    ? "Primul cadou se deschide pe 1 decembrie, în…"
    : todayWaiting
      ? `Cadoul de azi te așteaptă 🎁 · următorul (ziua ${next}) se deschide în…`
      : `Următorul cadou (ziua ${next}) se deschide în…`;
  let ms = unlockAt(next) - n, s = Math.floor(ms/1000);
  const v = { dd: Math.floor(s/86400), hh: Math.floor(s%86400/3600), mm: Math.floor(s%3600/60), ss: s%60 };
  for (const k in v){
    const t = pad(v[k]);
    if (els[k].textContent !== t){ els[k].textContent = t; els[k].classList.remove("tick"); void els[k].offsetWidth; els[k].classList.add("tick"); }
  }
}
refreshGifts(); tick(); setInterval(tick, 1000);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden){ refreshGifts(); tick(); } });

/* ---------- scântei la click oriunde ---------- */
function burst(x, y, n, glyphs){
  const cols = ["#ffe3a3","#ff6b7a","#ffffff","#7ee0b0"];
  for (let i=0;i<n;i++){
    const s = document.createElement("span"); s.className="spark";
    s.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    s.style.left = x+"px"; s.style.top = y+"px";
    s.style.color = cols[i%cols.length]; s.style.fontSize = (10+Math.random()*14)+"px";
    document.body.appendChild(s);
    const a = Math.random()*Math.PI*2, dist = 40+Math.random()*90;
    s.animate([
      {transform:"translate(-50%,-50%) scale(.4) rotate(0)", opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(a)*dist}px), calc(-50% + ${Math.sin(a)*dist + 30}px)) scale(1) rotate(${(Math.random()-.5)*360}deg)`, opacity:0}
    ], {duration:900+Math.random()*500, easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish = ()=>s.remove();
  }
}
document.addEventListener("pointerdown", e=>{
  if (e.target.closest(".gift, .letter, h1")) return;
  burst(e.clientX, e.clientY, 9, ["❄","✦","❅","♥"]);
});

/* ---------- ninsoare ---------- */
const sc = document.getElementById("snow"), sx = sc.getContext("2d");
let flakes = [], W, H, DPR;
function sizeCanvas(c, ctx){ DPR = Math.min(devicePixelRatio||1, 2); W = innerWidth; H = innerHeight; c.width = W*DPR; c.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
function initSnow(){
  sizeCanvas(sc, sx); sizeCanvas(fc, fx);
  const n = Math.round(Math.min(160, W*H/9000));
  flakes = Array.from({length:n}, ()=>({x:Math.random()*W, y:Math.random()*H, r:.6+Math.random()*2.6, s:.3+Math.random()*1, w:Math.random()*Math.PI*2}));
}
let wind = 0;
addEventListener("pointermove", e=>{ wind = (e.clientX/W - .5) * 1.2; });

/* ---------- confetti ---------- */
const fc = document.getElementById("fx"), fx = fc.getContext("2d");
let parts = [];
function confetti(x, y, n){
  const cols = ["#c8323c","#f2c66d","#fbf3e4","#2ea36f","#ff8fd1","#6cc6ff"];
  for (let i=0;i<n;i++){
    const a = -Math.PI/2 + (Math.random()-.5)*Math.PI*1.3, v = 4+Math.random()*9;
    parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, g:.18+Math.random()*.08, rot:Math.random()*6, vr:(Math.random()-.5)*.4,
      w:5+Math.random()*6, h:3+Math.random()*4, c:cols[i%cols.length], life:0, max:110+Math.random()*60, shape:Math.random()<.2?"heart":"rect"});
  }
}
function drawHeart(ctx, s){
  ctx.beginPath(); ctx.moveTo(0, s*.3);
  ctx.bezierCurveTo(-s, -s*.4, -s*.4, -s, 0, -s*.4);
  ctx.bezierCurveTo(s*.4, -s, s, -s*.4, 0, s*.3); ctx.fill();
}
initSnow(); addEventListener("resize", initSnow);

function loop(){
  sx.clearRect(0,0,W,H);
  sx.fillStyle = "rgba(255,255,255,.85)";
  for (const f of flakes){
    f.w += .01; f.y += f.s; f.x += Math.sin(f.w)*.4 + wind*f.s;
    if (f.y > H+5){ f.y = -5; f.x = Math.random()*W; }
    if (f.x > W+5) f.x = -5; if (f.x < -5) f.x = W+5;
    sx.globalAlpha = .35 + f.r/4;
    sx.beginPath(); sx.arc(f.x, f.y, f.r, 0, Math.PI*2); sx.fill();
  }
  sx.globalAlpha = 1;

  fx.clearRect(0,0,W,H);
  parts = parts.filter(p => p.life < p.max);
  for (const p of parts){
    p.life++; p.vy += p.g; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    fx.save(); fx.globalAlpha = Math.max(0, 1 - p.life/p.max); fx.translate(p.x, p.y); fx.rotate(p.rot); fx.fillStyle = p.c;
    if (p.shape==="heart") drawHeart(fx, 7); else fx.fillRect(-p.w/2, -p.h/2, p.w, p.h*Math.abs(Math.cos(p.rot*2)));
    fx.restore();
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
